
<!DOCTYPE html>
<html>
<head>
    <title>Simple Login Form</title>

    <style>
        body {
            background-color: #FCE4EC;
            font-family: Arial;
        }

        .login-box {
            width: 400px;
            margin: 100px auto;
            padding: 50px;
            background-color: white;
            border: 2px solid #C76B85;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            height: 35px;
            padding: 5px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            height: 40px;
            background-color: #C76B85;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Form</h2>

        <input type="email" placeholder="Enter Email">

        <input type="password" placeholder="Enter Password">

        <button>Login</button>

    </div>

</body>
</html>
