
<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            background-color: #C4B5FD;
            font-family: Arial;
        }

        .product-card {
            width: 350px;
            background-color: white;
            padding: 20px;
            margin: 80px auto;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .product-card img {
            width: 200px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-card h2 {
            color: #7C3AED;
        }

        .price {
            color: #795548;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #7C3AED;
            color: white;
            padding: 18px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3E2723;
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <div class="product-card">

        <img src="product.jpg" alt="Product Image">

        <h2>Wireless Headphones</h2>

        <p class="price">₹999</p>

        <button style="font-size: 16px;">
            Buy Now
        </button>

    </div>

</body>
</html>
